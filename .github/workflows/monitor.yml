name: eBay Monitor
on:
  schedule:
       - cron: '*/5 * * * *'
     workflow_dispatch:
     repository_dispatch:
       types: [trigger-monitor]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python ebay_monitor.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Commit seen-items file
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@example.com"
          git add seen_items.json
          git diff --staged --quiet || git commit -m "update seen items"
          git push
